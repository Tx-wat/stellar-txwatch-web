name: Bug report
description: Report something that is broken or behaving unexpectedly
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/Tx-wat/stellar-txwatch-web/issues) first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '/contracts/new'
        2. Enter '...'
        3. Click '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Does the issue occur in mock mode or with a backend API (`NEXT_PUBLIC_API_URL` set)?
      options:
        - Mock / local mode
        - API mode
        - Both
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      multiple: true
      options:
        - Mainnet
        - Testnet
        - Futurenet
        - Not network-specific
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 129 on macOS 15, Freighter 5.x
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or error messages
      description: Paste screenshots, console errors or logs. Remove any secrets or webhook URLs.
