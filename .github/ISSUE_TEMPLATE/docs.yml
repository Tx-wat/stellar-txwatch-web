name: Documentation
description: Report missing, outdated or unclear documentation
title: "[Docs]: "
labels: ["type: docs", "area: docs"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: File or section that needs attention.
      placeholder: e.g. README.md#project-structure, docs/FREIGHTER_INTEGRATION.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Type of issue
      options:
        - Missing documentation
        - Outdated or incorrect
        - Unclear or confusing
        - Typo or formatting
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Proposed wording or structure, if you have one.
